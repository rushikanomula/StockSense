<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense | Enterprise Inventory Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Root Container -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Application Script Logic -->
    <script>
        const DEFAULT_STATE = {
            currentUser: null, // { email, name, role }
            theme: 'light',
            activeTab: 'dashboard',
            warehouses: [
                { id: 'WH-MAIN', name: 'Main Warehouse', code: 'MAIN', address: '123 Logistics Blvd, Sector 4' },
                { id: 'WH-PROD', name: 'Production Floor', code: 'PROD', address: 'Building B, Assembly Line 2' }
            ],
            categories: ['Raw Materials', 'Finished Goods', 'Office Supplies', 'Electronics', 'Packaging'],
            products: [
                { id: 'PROD-1', name: 'Steel Rods (10mm)', sku: 'SR-10MM', category: 'Raw Materials', uop: 'Units', minStock: 20, stockByWarehouse: { 'WH-MAIN': 45, 'WH-PROD': 15 } },
                { id: 'PROD-2', name: 'Ergonomic Office Chairs', sku: 'FUR-CHAIR', category: 'Finished Goods', uop: 'Pcs', minStock: 10, stockByWarehouse: { 'WH-MAIN': 8, 'WH-PROD': 2 } },
                { id: 'PROD-3', name: 'Copper Wiring Spool', sku: 'ELC-COP', category: 'Raw Materials', uop: 'Meters', minStock: 100, stockByWarehouse: { 'WH-MAIN': 250, 'WH-PROD': 80 } },
                { id: 'PROD-4', name: 'Industrial Cardboard Boxes', sku: 'PKG-BOX', category: 'Packaging', uop: 'Units', minStock: 50, stockByWarehouse: { 'WH-MAIN': 30, 'WH-PROD': 10 } },
                { id: 'PROD-5', name: 'Precision Screws (Pack of 100)', sku: 'HW-SCR', category: 'Raw Materials', uop: 'Packs', minStock: 15, stockByWarehouse: { 'WH-MAIN': 12, 'WH-PROD': 25 } }
            ],
            operations: [
                { id: 'WH/REC/0001', type: 'Receipt', partner: 'Apex Metals Inc.', warehouse: 'WH-MAIN', status: 'Ready', date: '2026-03-24', items: [{ productId: 'PROD-1', qty: 30 }] },
                { id: 'WH/REC/0002', type: 'Receipt', partner: 'Global Copper Co.', warehouse: 'WH-MAIN', status: 'Draft', date: '2026-03-26', items: [{ productId: 'PROD-3', qty: 100 }] },
                { id: 'WH/OUT/0001', type: 'Delivery', partner: 'TechCorp Solutions', warehouse: 'WH-MAIN', status: 'Ready', date: '2026-03-25', items: [{ productId: 'PROD-2', qty: 5 }] },
                { id: 'WH/OUT/0002', type: 'Delivery', partner: 'BuildIt Enterprises', warehouse: 'WH-PROD', status: 'Waiting', date: '2026-03-26', items: [{ productId: 'PROD-1', qty: 10 }] },
                { id: 'WH/INT/0001', type: 'Internal', partner: 'Main Warehouse → Production Floor', warehouse: 'WH-MAIN', targetWarehouse: 'WH-PROD', status: 'Done', date: '2026-03-22', items: [{ productId: 'PROD-1', qty: 15 }] },
                { id: 'WH/ADJ/0001', type: 'Adjustment', partner: 'Quarterly Physical Count', warehouse: 'WH-MAIN', status: 'Done', date: '2026-03-20', items: [{ productId: 'PROD-4', countedQty: 30 }] }
            ],
            moveHistory: [
                { id: 'MOV-101', timestamp: '2026-03-22 14:30', ref: 'WH/INT/0001', type: 'Internal', product: 'Steel Rods (10mm)', qtyChange: 15, fromLoc: 'Main Warehouse', toLoc: 'Production Floor', status: 'Done' },
                { id: 'MOV-100', timestamp: '2026-03-20 09:15', ref: 'WH/ADJ/0001', type: 'Adjustment', product: 'Industrial Cardboard Boxes', qtyChange: -5, fromLoc: 'Main Warehouse', toLoc: 'Discrepancy Loss', status: 'Done' }
            ]
        };

        let state = JSON.parse(localStorage.getItem('stocksense_state')) || DEFAULT_STATE;

        function saveState() {
            localStorage.setItem('stocksense_state', JSON.stringify(state));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-indigo-600';
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl pointer-events-auto flex items-center gap-3 transform translate-y-2 opacity-0 transition-all duration-300 font-medium text-sm`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-circle' : 'info'}" class="w-5 h-5 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = renderAuthScreen();
            } else {
                app.innerHTML = renderMainLayout();
            }
            lucide.createIcons();
            attachEventHandlers();
        }

        // Authentication & Password Reset Flow State
        let authMode = 'login'; // login, signup, forgot
        let forgotStep = 1; // 1: email, 2: otp, 3: new password
        let simulatedOtpCode = '123456';

        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-slate-100 to-indigo-50 dark:from-slate-950 dark:to-slate-900 p-4">
                    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-8">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 text-white rounded-2xl shadow-lg shadow-indigo-500/30 mb-4">
                                <i data-lucide="boxes" class="w-7 h-7"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">StockSense IMS</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Enterprise Inventory & Warehouse Intelligence</p>
                        </div>

                        ${authMode === 'login' ? `
                            <form id="login-form" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Email Address</label>
                                    <input type="email" id="login-email" required value="admin@stocksense.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                </div>
                                <div>
                                    <div class="flex items-center justify-between mb-1">
                                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
                                        <button type="button" onclick="authMode='forgot'; forgotStep=1; render();" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">Forgot password?</button>
                                    </div>
                                    <input type="password" id="login-password" required value="password" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                </div>
                                <div class="bg-indigo-50 dark:bg-indigo-950/40 p-3 rounded-xl border border-indigo-100 dark:border-indigo-900/50 text-xs text-indigo-700 dark:text-indigo-300 flex items-center gap-2">
                                    <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
                                    <span>Demo credentials pre-filled: <b>admin@stocksense.com</b></span>
                                </div>
                                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2">
                                    <span>Sign In to Dashboard</span>
                                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </button>
                                <div class="text-center mt-4 text-sm text-slate-500 dark:text-slate-400">
                                    Don't have an account? <button type="button" onclick="authMode='signup'; render();" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Sign Up</button>
                                </div>
                            </form>
                        ` : authMode === 'signup' ? `
                            <form id="signup-form" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Full Name</label>
                                    <input type="text" id="signup-name" required placeholder="John Doe" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Email Address</label>
                                    <input type="email" id="signup-email" required placeholder="john@company.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Password (Min 8 chars)</label>
                                    <input type="password" id="signup-password" required minlength="8" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                </div>
                                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2">
                                    <span>Create Account</span>
                                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                                </button>
                                <div class="text-center mt-4 text-sm text-slate-500 dark:text-slate-400">
                                    Already have an account? <button type="button" onclick="authMode='login'; render();" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">Sign In</button>
                                </div>
                            </form>
                        ` : `
                            <div class="space-y-4">
                                ${forgotStep === 1 ? `
                                    <form id="forgot-step1" class="space-y-4">
                                        <p class="text-sm text-slate-600 dark:text-slate-300">Enter your registered email address to receive a secure 6-digit OTP code.</p>
                                        <div>
                                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Email Address</label>
                                            <input type="email" id="forgot-email" required value="admin@stocksense.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                        </div>
                                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm transition">Send Reset OTP</button>
                                    </form>
                                ` : forgotStep === 2 ? `
                                    <form id="forgot-step2" class="space-y-4">
                                        <div class="bg-emerald-50 dark:bg-emerald-950/40 p-3 rounded-xl border border-emerald-100 dark:border-emerald-900/50 text-xs text-emerald-700 dark:text-emerald-300 flex items-center gap-2">
                                            <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i>
                                            <span>OTP sent! Simulated code: <b>123456</b></span>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Enter 6-Digit OTP</label>
                                            <input type="text" id="otp-code" required maxlength="6" value="123456" class="w-full px-4 py-2.5 text-center tracking-widest text-lg font-bold rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                        </div>
                                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm transition">Verify OTP</button>
                                    </form>
                                ` : `
                                    <form id="forgot-step3" class="space-y-4">
                                        <div>
                                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">New Password</label>
                                            <input type="password" id="new-password" required minlength="8" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
                                        </div>
                                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm transition">Update Password & Login</button>
                                    </form>
                                `}
                                <div class="text-center mt-4 text-sm">
                                    <button type="button" onclick="authMode='login'; render();" class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline flex items-center justify-center gap-1 mx-auto">
                                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Login
                                    </button>
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        let mobileMenuOpen = false;

        function renderMainLayout() {
            return `
                <div class="flex h-screen overflow-hidden">
                    <aside class="hidden md:flex flex-col w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 z-20">
                        ${renderSidebarContent()}
                    </aside>

                    ${mobileMenuOpen ? `
                        <div class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm md:hidden flex" onclick="toggleMobileMenu()">
                            <div class="w-64 bg-white dark:bg-slate-800 h-full flex flex-col shadow-2xl" onclick="event.stopPropagation()">
                                ${renderSidebarContent()}
                            </div>
                        </div>
                    ` : ''}

                    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
                        <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 z-10 shrink-0">
                            <div class="flex items-center gap-4">
                                <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
                                    <i data-lucide="menu" class="w-5 h-5"></i>
                                </button>
                                <h2 class="text-lg font-bold text-slate-800 dark:text-white capitalize flex items-center gap-2">
                                    ${state.activeTab === 'dashboard' ? 'Inventory Dashboard' : state.activeTab}
                                </h2>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="toggleTheme()" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Toggle Theme">
                                    <i data-lucide="${state.theme === 'dark' ? 'sun' : 'moon'}" class="w-5 h-5"></i>
                                </button>
                                <div class="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-700">
                                    <div class="w-9 h-9 bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300 rounded-full flex items-center font-bold text-sm justify-center">
                                        ${state.currentUser.name.charAt(0)}
                                    </div>
                                    <div class="hidden sm:block text-left">
                                        <div class="text-xs font-bold text-slate-800 dark:text-white">${state.currentUser.name}</div>
                                        <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase">${state.currentUser.role || 'Administrator'}</div>
                                    </div>
                                    <button onclick="logout()" class="p-2 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-lg transition" title="Log Out">
                                        <i data-lucide="log-out" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </header>

                        <main class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-slate-900">
                            ${renderActiveModule()}
                        </main>
                    </div>
                </div>
            `;
        }

        function renderSidebarContent() {
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                { id: 'products', label: 'Products Catalog', icon: 'package' },
                { id: 'receipts', label: 'Receipts (Incoming)', icon: 'arrow-down-left' },
                { id: 'deliveries', label: 'Delivery Orders', icon: 'truck' },
                { id: 'transfers', label: 'Internal Transfers', icon: 'repeat' },
                { id: 'adjustments', label: 'Stock Adjustments', icon: 'sliders' },
                { id: 'history', label: 'Move History Ledger', icon: 'history' },
                { id: 'settings', label: 'Warehouses & Settings', icon: 'settings' }
            ];

            return `
                <div class="p-6 border-b border-slate-200 dark:border-slate-700 flex items-center gap-3 shrink-0">
                    <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-indigo-500/20">
                        <i data-lucide="boxes" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base text-slate-900 dark:text-white tracking-tight">StockSense</h1>
                        <span class="text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">Enterprise IMS</span>
                    </div>
                </div>
                <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                    ${navItems.map(item => `
                        <button onclick="setActiveTab('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition ${state.activeTab === item.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white'}">
                            <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                            <span>${item.label}</span>
                        </button>
                    `).join('')}
                </nav>
                <div class="p-4 border-t border-slate-200 dark:border-slate-700 shrink-0">
                    <div class="bg-indigo-50 dark:bg-indigo-950/40 p-3.5 rounded-xl border border-indigo-100 dark:border-indigo-900/50">
                        <div class="flex items-center gap-2 text-indigo-700 dark:text-indigo-300 font-semibold text-xs mb-1">
                            <i data-lucide="shield-check" class="w-4 h-4"></i>
                            <span>Secure Mode</span>
                        </div>
                        <p class="text-[11px] text-indigo-600/80 dark:text-indigo-400/80 leading-relaxed">Atomic transactions & stock locks active.</p>
                    </div>
                </div>
            `;
        }

        function renderActiveModule() {
            switch(state.activeTab) {
                case 'dashboard': return renderDashboard();
                case 'products': return renderProductsModule();
                case 'receipts': return renderReceiptsModule();
                case 'deliveries': return renderDeliveriesModule();
                case 'transfers': return renderTransfersModule();
                case 'adjustments': return renderAdjustmentsModule();
                case 'history': return renderHistoryModule();
                case 'settings': return renderSettingsModule();
                default: return renderDashboard();
            }
        }

        function renderDashboard() {
            let totalProducts = state.products.length;
            let lowStockCount = 0;
            state.products.forEach(p => {
                let totalStock = Object.values(p.stockByWarehouse).reduce((a, b) => a + b, 0);
                if (totalStock <= p.minStock) lowStockCount++;
            });

            let pendingReceipts = state.operations.filter(o => o.type === 'Receipt' && o.status !== 'Done' && o.status !== 'Canceled').length;
            let pendingDeliveries = state.operations.filter(o => o.type === 'Delivery' && o.status !== 'Done' && o.status !== 'Canceled').length;
            let scheduledTransfers = state.operations.filter(o => o.type === 'Internal' && o.status !== 'Done' && o.status !== 'Canceled').length;

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="package" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase">Total Products</div>
                                <div class="text-2xl font-bold text-slate-800 dark:text-white mt-0.5">${totalProducts}</div>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase">Low / Out of Stock</div>
                                <div class="text-2xl font-bold text-amber-600 dark:text-amber-400 mt-0.5">${lowStockCount}</div>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="arrow-down-left" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase">Pending Receipts</div>

                            </div>
                        </div>
                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="truck" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase">Pending Deliveries</div>
                                <div class="text-2xl font-bold text-slate-800 dark:text-white mt-0.5">${pendingDeliveries}</div>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-purple-50 dark:bg-purple-950 text-purple-600 dark:text-purple-400 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="repeat" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <div class="text-xs font-semibold text-slate-400 uppercase">Scheduled Transfers</div>
                                <div class="text-2xl font-bold text-slate-800 dark:text-white mt-0.5">${scheduledTransfers}</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                        <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
                            <div>
                                <h3 class="font-bold text-base text-slate-800 dark:text-white">Active Operations Control</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400">Filter and validate incoming, outgoing, and transfer operations</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-2">
                                <select id="filter-type" onchange="render()" class="px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 outline-none">
                                    <option value="">All Types</option>
                                    <option value="Receipt">Receipts</option>
                                    <option value="Delivery">Deliveries</option>
                                    <option value="Internal">Internal Transfers</option>
                                    <option value="Adjustment">Adjustments</option>
                                </select>
                                <select id="filter-status" onchange="render()" class="px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 outline-none">
                                    <option value="">All Statuses</option>
                                    <option value="Draft">Draft</option>
                                    <option value="Waiting">Waiting</option>
                                    <option value="Ready">Ready</option>
                                    <option value="Done">Done</option>
                                    <option value="Canceled">Canceled</option>
                                </select>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 dark:bg-slate-900 text-xs uppercase font-semibold text-slate-400 border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th class="px-6 py-4">Reference</th>
                                        <th class="px-6 py-4">Operation Type</th>
                                        <th class="px-6 py-4">Partner / Description</th>
                                        <th class="px-6 py-4">Warehouse</th>
                                        <th class="px-6 py-4">Status</th>
                                        <th class="px-6 py-4">Date</th>
                                        <th class="px-6 py-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                                    ${renderOperationsRows()}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOperationsRows() {
            const typeFilter = document.getElementById('filter-type')?.value || '';
            const statusFilter = document.getElementById('filter-status')?.value || '';

            let filtered = state.operations.filter(op => {
                if (typeFilter && op.type !== typeFilter) return false;
                if (statusFilter && op.status !== statusFilter) return false;
                return true;
            });

            if (filtered.length === 0) {
                return `<tr><td colspan="7" class="px-6 py-8 text-center text-slate-400">No operations found matching current filters.</td></tr>`;
            }

            return filtered.map(op => {
                const statusColor = op.status === 'Done' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400' :
                                    op.status === 'Ready' ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-400' :
                                    op.status === 'Waiting' ? 'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400' :
                                    'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300';
                return `
                    <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition">
                        <td class="px-6 py-4 font-bold text-slate-800 dark:text-white font-mono">${op.id}</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center gap-1.5 font-medium text-xs">
                                <i data-lucide="${op.type === 'Receipt' ? 'arrow-down-left' : op.type === 'Delivery' ? 'truck' : op.type === 'Internal' ? 'repeat' : 'sliders'}" class="w-4 h-4 text-indigo-500"></i>
                                ${op.type}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-slate-600 dark:text-slate-300">${op.partner}</td>
                        <td class="px-6 py-4 text-slate-600 dark:text-slate-300 font-mono text-xs">${op.warehouse}</td>
                        <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">${op.status}</span></td>
                        <td class="px-6 py-4 text-slate-500 text-xs">${op.date}</td>
                        <td class="px-6 py-4 text-right">
                            ${op.status !== 'Done' && op.status !== 'Canceled' ? `
                                <button onclick="validateOperation('${op.id}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-medium shadow-sm transition">Validate & Sync</button>
                            ` : `
                                <span class="text-xs text-slate-400 font-medium">Completed</span>
                            `}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        let productSearch = '';
        let categoryFilter = '';

        function renderProductsModule() {
            let filtered = state.products.filter(p => {
                if (categoryFilter && p.category !== categoryFilter) return false;
                if (productSearch && !p.name.toLowerCase().includes(productSearch.toLowerCase()) && !p.sku.toLowerCase().includes(productSearch.toLowerCase())) return false;
                return true;
            });

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div class="flex flex-wrap items-center gap-3 flex-1">
                            <div class="relative flex-1 min-w-[240px]">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                                <input type="text" id="product-search" value="${productSearch}" oninput="productSearch=this.value; render();" placeholder="Search by product name or SKU..." class="w-full pl-10 pr-4 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 outline-none">
                            </div>
                            <select id="category-filter" onchange="categoryFilter=this.value; render();" class="px-3.5 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 outline-none">
                                <option value="">All Categories</option>
                                ${state.categories.map(c => `<option value="${c}" ${categoryFilter === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="openProductModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Add New Product</span>
                        </button>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 dark:bg-slate-900 text-xs uppercase font-semibold text-slate-400 border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th class="px-6 py-4">Product Name & SKU</th>
                                        <th class="px-6 py-4">Category</th>
                                        <th class="px-6 py-4">UOM</th>
                                        <th class="px-6 py-4">Main Warehouse</th>
                                        <th class="px-6 py-4">Production Floor</th>
                                        <th class="px-6 py-4">Total Stock</th>
                                        <th class="px-6 py-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                                    ${filtered.length === 0 ? `<tr><td colspan="7" class="px-6 py-8 text-center text-slate-400">No products found.</td></tr>` :
                                        filtered.map(p => {
                                            const mainStock = p.stockByWarehouse['WH-MAIN'] || 0;
                                            const prodStock = p.stockByWarehouse['WH-PROD'] || 0;
                                            const total = mainStock + prodStock;
                                            const isLow = total <= p.minStock;
                                            return `
                                                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition">
                                                    <td class="px-6 py-4">
                                                        <div class="font-bold text-slate-800 dark:text-white">${p.name}</div>
                                                        <div class="text-xs text-slate-400 font-mono">${p.sku}</div>
                                                    </td>
                                                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-lg text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium">${p.category}</span></td>
                                                    <td class="px-6 py-4 text-slate-600 dark:text-slate-300 text-xs font-medium">${p.uop}</td>
                                                    <td class="px-6 py-4 font-mono text-slate-800 dark:text-slate-200">${mainStock}</td>
                                                    <td class="px-6 py-4 font-mono text-slate-800 dark:text-slate-200">${prodStock}</td>
                                                    <td class="px-6 py-4">
                                                        <div class="flex items-center gap-2">
                                                            <span class="font-bold font-mono text-slate-900 dark:text-white">${total}</span>${isLow ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-400">Low Stock</span>` : ''}
                                                        </div>
                                                    </td>
                                                    <td class="px-6 py-4 text-right">
                                                        <button onclick="editProduct('${p.id}')" class="p-2 text-indigo-600 hover:bg-indigo-50 dark:hover:bg-slate-700 rounded-lg transition" title="Edit Product">
                                                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReceiptsModule() { return renderGenericOperationModule('Receipt', 'Incoming Receipts (Vendors)', 'arrow-down-left', 'Create Receipt'); }
        function renderDeliveriesModule() { return renderGenericOperationModule('Delivery', 'Outgoing Deliveries (Customers)', 'truck', 'Create Delivery Order'); }
        function renderTransfersModule() { return renderGenericOperationModule('Internal', 'Internal Location Transfers', 'repeat', 'Schedule Transfer'); }
        function renderAdjustmentsModule() { return renderGenericOperationModule('Adjustment', 'Stock Discrepancy Adjustments', 'sliders', 'New Adjustment'); }

        function renderGenericOperationModule(type, title, icon, btnText) {
            let filtered = state.operations.filter(o => o.type === type);
            return `
                <div class="space-y-6">
                    <div class="flex items-center justify-between bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <div>
                            <h3 class="font-bold text-base text-slate-800 dark:text-white">${title}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400">Manage workflow, atomic validation, and inventory changes</p>
                        </div>
                        <button onclick="openOperationModal('${type}')" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-lg shadow-indigo-600/20 transition flex items-center gap-2">
                            <i data-lucide="${icon}" class="w-4 h-4"></i>
                            <span>${btnText}</span>
                        </button>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 dark:bg-slate-900 text-xs uppercase font-semibold text-slate-400 border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th class="px-6 py-4">Reference</th>
                                        <th class="px-6 py-4">Partner / Description</th>
                                        <th class="px-6 py-4">Warehouse</th>
                                        <th class="px-6 py-4">Items Summary</th>
                                        <th class="px-6 py-4">Status</th>
                                        <th class="px-6 py-4">Date</th>
                                        <th class="px-6 py-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                                    ${filtered.length === 0 ? `<tr><td colspan="7" class="px-6 py-8 text-center text-slate-400">No records found.</td></tr>` :
                                        filtered.map(op => {
                                            const statusColor = op.status === 'Done' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400' :
                                                                op.status === 'Ready' ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-400' :
                                                                'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400';
                                            let itemsText = op.items.map(i => {
                                                const prod = state.products.find(p => p.id === i.productId);
                                                return `${prod ? prod.name : 'Item'} (${i.qty !== undefined ? i.qty : 'Count: ' + i.countedQty})`;
                                            }).join(', ');

                                            return `
                                                <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition">
                                                    <td class="px-6 py-4 font-bold text-slate-800 dark:text-white font-mono">${op.id}</td>
                                                    <td class="px-6 py-4 text-slate-600 dark:text-slate-300">${op.partner}</td>
                                                    <td class="px-6 py-4 text-slate-600 dark:text-slate-300 font-mono text-xs">${op.warehouse}${op.targetWarehouse ? '→ ' + op.targetWarehouse : ''}</td>
                                                    <td class="px-6 py-4 text-slate-500 text-xs truncate max-w-xs">${itemsText}</td>
                                                    <td class="px-6 py-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${statusColor}">${op.status}</span></td>
                                                    <td class="px-6 py-4 text-slate-500 text-xs">${op.date}</td>
                                                    <td class="px-6 py-4 text-right">
                                                        ${op.status !== 'Done' && op.status !== 'Canceled' ? `
                                                            <button onclick="validateOperation('${op.id}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-medium shadow-sm transition">Validate</button>
                                                        ` : `
                                                            <span class="text-xs text-slate-400 font-medium">Completed</span>
                                                        `}
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHistoryModule() {
            return `
                <div class="space-y-6">
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <h3 class="font-bold text-base text-slate-800 dark:text-white">Immutable Move History Ledger</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Audit trail of verified stock transactions, shipments, and adjustments</p>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 dark:bg-slate-900 text-xs uppercase font-semibold text-slate-400 border-b border-slate-200 dark:border-slate-700">
                                    <tr>
                                        <th class="px-6 py-4">Timestamp</th>
                                        <th class="px-6 py-4">Reference</th>
                                        <th class="px-6 py-4">Type</th>
                                        <th class="px-6 py-4">Product</th>
                                        <th class="px-6 py-4">Qty Change</th>
                                        <th class="px-6 py-4">From Location</th>
                                        <th class="px-6 py-4">To Location</th>

                                </thead>
                                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">

                                        state.moveHistory.map(h => `
                                            <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition">
                                                <td class="px-6 py-4 text-xs font-mono text-slate-500">${h.timestamp}</td>
                                                <td class="px-6 py-4 font-bold font-mono text-slate-800 dark:text-white">${h.ref}</td>

                                                <td class="px-6 py-4 font-medium text-slate-800 dark:text-slate-200">${h.product}</td>
                                                <td class="px-6 py-4 font-mono font-bold ${h.qtyChange > 0 ? 'text-emerald-600' : 'text-rose-600'}">${h.qtyChange > 0 ? '+' + h.qtyChange : h.qtyChange}</td>

                                                <td class="px-6 py-4 text-slate-600 dark:text-slate-300 text-xs">${h.toLoc}</td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSettingsModule() {
            return `
                <div class="space-y-6 max-w-4xl">
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-2">Warehouse Configuration</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">Manage warehouse locations and divisions</p>
                        <div class="space-y-4">
                            ${state.warehouses.map(w => `
                                <div class="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                                    <div>
                                        <div class="font-bold text-slate-800 dark:text-white text-sm">${w.name} <span class="font-mono text-xs text-indigo-500 ml-2">(${w.code})</span></div>
                                        <div class="text-xs text-slate-500 mt-0.5">${w.address}</div>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-400">Active</span>

                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-2">System Reset & Maintenance</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Reset all data back to the default sample dataset</p>
                        <button onclick="resetSystemData()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-medium shadow-sm transition">Reset to Default Sample Data</button>

                </div>

        function openProductModal(productId = null) {
            const product = productId ? state.products.find(p => p.id === productId) : null;
            const modalHtml = `
                <div id="custom-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target === this) closeModal()">

                            <h3 class="font-bold text-lg text-slate-800 dark:text-white">${product ? 'Edit Product' : 'Add New Product'}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form id="product-form" class="space-y-4">
                            <input type="hidden" id="prod-id" value="${product ? product.id : ''}">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Product Name</label>
                                <input type="text" id="prod-name" required value="${product ? product.name : ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">SKU / Code</label>
                                    <input type="text" id="prod-sku" required value="${product ? product.sku : ''}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-mono">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Category</label>
                                    <select id="prod-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                        ${state.categories.map(c => `<option value="${c}" ${product && product.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Unit of Measure (UOM)</label>
                                    <input type="text" id="prod-uop" required value="${product ? product.uop : 'Units'}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Minimum Stock Alert</label>
                                    <input type="number" id="prod-min" required value="${product ? product.minStock : 10}" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                </div>
                            </div>
                            ${!product ? `
                                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-200 dark:border-slate-700">
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Main Warehouse Initial</label>
                                        <input type="number" id="prod-stock-main" value="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Production Floor Initial</label>
                                        <input type="number" id="prod-stock-prod" value="0" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                    </div>
                                </div>
                            ` : ''}
                            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700">Cancel</button>
                                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md">Save Product</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();

            document.getElementById('product-form').onsubmit = (e) => {
                e.preventDefault();
                const id = document.getElementById('prod-id').value;
                const name = document.getElementById('prod-name').value;
                const sku = document.getElementById('prod-sku').value;
                const category = document.getElementById('prod-category').value;
                const uop = document.getElementById('prod-uop').value;
                const minStock = parseInt(document.getElementById('prod-min').value) || 10;

                if (id) {
                    let p = state.products.find(item => item.id === id);
                    if (p) {
                        p.name = name; p.sku = sku; p.category = category; p.uop = uop; p.minStock = minStock;
                    }
                    showToast('Product updated successfully!');
                } else {
                    const newId = 'PROD-' + (state.products.length + 10);
                    const stockMain = parseInt(document.getElementById('prod-stock-main').value) || 0;
                    const stockProd = parseInt(document.getElementById('prod-stock-prod').value) || 0;
                    state.products.push({
                        id: newId, name, sku, category, uop, minStock,
                        stockByWarehouse: { 'WH-MAIN': stockMain, 'WH-PROD': stockProd }
                    });
                    showToast('New product created successfully!');
                }
                saveState();
                closeModal();
                render();
            };
        }

        function openOperationModal(type) {
            const isAdj = type === 'Adjustment';
            const modalHtml = `
                <div id="custom-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 max-w-lg w-full p-6 space-y-6">
                        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
                            <h3 class="font-bold text-lg text-slate-800 dark:text-white">Create New ${type}</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form id="operation-form" class="space-y-4">
                            <input type="hidden" id="op-type" value="${type}">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">${type === 'Receipt' ? 'Supplier Name' : type === 'Delivery' ? 'Customer Name' : 'Reason / Reference'}</label>
                                <input type="text" id="op-partner" required placeholder="e.g. Acme Corporation" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Warehouse</label>
                                    <select id="op-warehouse" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                        <option value="WH-MAIN">Main Warehouse</option>
                                        <option value="WH-PROD">Production Floor</option>
                                    </select>
                                </div>
                                ${type === 'Internal' ? `
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Target Warehouse</label>
                                        <select id="op-target-warehouse" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                            <option value="WH-PROD">Production Floor</option>
                                            <option value="WH-MAIN">Main Warehouse</option>
                                        </select>
                                    </div>
                                ` : `
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status</label>
                                        <select id="op-status" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                            <option value="Ready">Ready</option>
                                            <option value="Draft">Draft</option>
                                            <option value="Waiting">Waiting</option>
                                        </select>
                                    </div>
                                `}
                            </div>
                            <div class="space-y-3 pt-2 border-t border-slate-200 dark:border-slate-700">
                                <label class="block text-xs font-semibold uppercase text-slate-500">Select Product & ${isAdj ? 'Physical Count' : 'Quantity'}</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <div class="col-span-2">
                                        <select id="op-product" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                            ${state.products.map(p => `<option value="${p.id}">${p.name} (${p.sku})</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <input type="number" id="op-qty" required value="10" placeholder="${isAdj ? 'Counted Qty' : 'Qty'}" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm outline-none">
                                    </div>
                                </div>
                            </div>
                            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
                                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-sm font-medium">Cancel</button>
                                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md">Create & Schedule</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            lucide.createIcons();

            document.getElementById('operation-form').onsubmit = (e) => {
                e.preventDefault();
                const type = document.getElementById('op-type').value;
                const partner = document.getElementById('op-partner').value;
                const warehouse = document.getElementById('op-warehouse').value;
                const targetWarehouse = document.getElementById('op-target-warehouse')?.value || null;
                const status = document.getElementById('op-status')?.value || 'Ready';
                const productId = document.getElementById('op-product').value;
                const val = parseInt(document.getElementById('op-qty').value) || 0;

                const codePrefix = type === 'Receipt' ? 'REC' : type === 'Delivery' ? 'OUT' : type === 'Internal' ? 'INT' : 'ADJ';
                const newId = `WH/${codePrefix}/000${state.operations.length + 1}`;

                let itemObj = type === 'Adjustment' ? { productId, countedQty: val } : { productId, qty: val };

                state.operations.unshift({
                    id: newId, type, partner, warehouse, targetWarehouse, status,
                    date: new Date().toISOString().split('T')[0],
                    items: [itemObj]
                });

                saveState();
                closeModal();
                showToast(`${type} operation scheduled successfully!`);
                render();
            };
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            if (modal) modal.remove();
        }

        // STRICT ATOMIC VALIDATION & NEGATIVE STOCK PREVENTION
        function validateOperation(opId) {
            const op = state.operations.find(o => o.id === opId);
            if (!op || op.status === 'Done') return;

            // Pre-flight check for Delivery / Internal transfers (Prevent negative stock)
            if (op.type === 'Delivery' || op.type === 'Internal') {
                for (const item of op.items) {
                    const product = state.products.find(p => p.id === item.productId);
                    const currentStock = product?.stockByWarehouse[op.warehouse] || 0;
                    if (currentStock < item.qty) {
                        showToast(`Validation Failed: Insufficient stock for ${product.name}. Available: ${currentStock}, Required: ${item.qty}`, 'error');
                        return;
                    }
                }
            }

            // Execute stock adjustments & updates atomically
            op.items.forEach(item => {
                const product = state.products.find(p => p.id === item.productId);
                if (!product) return;
                if (!product.stockByWarehouse) product.stockByWarehouse = {};

                const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 16);

                if (op.type === 'Receipt') {
                    product.stockByWarehouse[op.warehouse] = (product.stockByWarehouse[op.warehouse] || 0) + item.qty;
                    state.moveHistory.unshift({
                        id: 'MOV-' + Math.floor(Math.random() * 90000 + 10000),
                        timestamp, ref: op.id, type: 'Receipt', product: product.name, qtyChange: item.qty,
                        fromLoc: op.partner, toLoc: op.warehouse, status: 'Done'
                    });
                } else if (op.type === 'Delivery') {
                    product.stockByWarehouse[op.warehouse] -= item.qty;
                    state.moveHistory.unshift({
                        id: 'MOV-' + Math.floor(Math.random() * 90000 + 10000),
                        timestamp, ref: op.id, type: 'Delivery', product: product.name, qtyChange: -item.qty,
                        fromLoc: op.warehouse, toLoc: op.partner, status: 'Done'
                    });
                } else if (op.type === 'Internal') {
                    product.stockByWarehouse[op.warehouse] -= item.qty;
                    product.stockByWarehouse[op.targetWarehouse] = (product.stockByWarehouse[op.targetWarehouse] || 0) + item.qty;
                    state.moveHistory.unshift({
                        id: 'MOV-' + Math.floor(Math.random() * 90000 + 10000),
                        timestamp, ref: op.id, type: 'Internal', product: product.name, qtyChange: item.qty,
                        fromLoc: op.warehouse, toLoc: op.targetWarehouse, status: 'Done'
                    });
                } else if (op.type === 'Adjustment') {
                    const currentQty = product.stockByWarehouse[op.warehouse] || 0;
                    const counted = item.countedQty;
                    const variance = counted - currentQty;
                    product.stockByWarehouse[op.warehouse] = counted;
                    state.moveHistory.unshift({
                        id: 'MOV-' + Math.floor(Math.random() * 90000 + 10000),
                        timestamp, ref: op.id, type: 'Adjustment', product: product.name, qtyChange: variance,
                        fromLoc: op.warehouse, toLoc: variance < 0 ? 'Discrepancy Loss' : 'Physical Count Gain', status: 'Done'
                    });
                }
            });

            op.status = 'Done';
            saveState();
            showToast(`Operation ${op.id} validated successfully & ledger synchronized!`);
            render();
        }

        function attachEventHandlers() {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.onsubmit = (e) => {
                    e.preventDefault();
                    const email = document.getElementById('login-email').value;
                    state.currentUser = { email, name: email.split('@')[0], role: 'Administrator' };
                    saveState();
                    showToast('Successfully authenticated!');
                    render();
                };
            }

            const signupForm = document.getElementById('signup-form');
            if (signupForm) {
                signupForm.onsubmit = (e) => {
                    e.preventDefault();
                    const name = document.getElementById('signup-name').value;
                    const email = document.getElementById('signup-email').value;
                    state.currentUser = { email, name, role: 'Administrator' };
                    saveState();
                    showToast('Account created & logged in successfully!');
                    render();
                };
            }

            const f1 = document.getElementById('forgot-step1');
            if (f1) { f1.onsubmit = (e) => { e.preventDefault(); forgotStep = 2; render(); }; }
            const f2 = document.getElementById('forgot-step2');
            if (f2) {
                f2.onsubmit = (e) => {
                    e.preventDefault();
                    if (document.getElementById('otp-code').value === simulatedOtpCode) {
                        forgotStep = 3; render();
                    } else {
                        showToast('Invalid OTP code. Use 123456', 'error');
                    }
                };
            }
            const f3 = document.getElementById('forgot-step3');
            if (f3) {
                f3.onsubmit = (e) => {
                    e.preventDefault();
                    showToast('Password successfully reset! Please login.');
                    authMode = 'login';
                    render();
                };
            }
        }

        function setActiveTab(tab) {
            state.activeTab = tab;
            mobileMenuOpen = false;
            saveState();
            render();
        }

        function toggleMobileMenu() {
            mobileMenuOpen = !mobileMenuOpen;
            render();
        }

        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            document.documentElement.classList.toggle('dark', state.theme === 'dark');
            saveState();
            render();
        }

        function logout() {
            state.currentUser = null;
            saveState();
            showToast('Logged out securely', 'info');
            render();
        }

        function resetSystemData() {
            state = JSON.parse(JSON.stringify(DEFAULT_STATE));
            saveState();
            showToast('System data reset to initial sample set!');
            render();
        }

        function editProduct(productId) {
            openProductModal(productId);
        }

        window.onload = () => {
            if (state.theme === 'dark') {
                document.documentElement.classList.add('dark');
            }
            render();
        };
    </script>
</body>
</html>
